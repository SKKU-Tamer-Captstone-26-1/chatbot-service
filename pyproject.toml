[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontheblock-ai-chatbot-service"
version = "0.1.0"
description = "ONTHEBLOCK AI chatbot gRPC service skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1",
    "grpcio>=1.62,<2",
    "grpcio-health-checking>=1.62,<2",
    "protobuf>=4.25,<6",
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.62,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
chatbot-service = "chatbot_service.main:main"
chatbot-migrate = "chatbot_service.storage.migrations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/chatbot_service/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
