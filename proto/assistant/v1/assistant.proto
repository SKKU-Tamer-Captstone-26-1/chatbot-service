syntax = "proto3";

package ontheblock.assistant.v1;

import "google/protobuf/timestamp.proto";

service AssistantService {
  rpc AskAssistant(AskAssistantRequest) returns (AskAssistantResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc RecordAssistantFeedback(RecordAssistantFeedbackRequest) returns (RecordAssistantFeedbackResponse);
}

enum AssistantIntent {
  ASSISTANT_INTENT_UNSPECIFIED = 0;
  ASSISTANT_INTENT_RECOMMEND_BEVERAGE = 1;
  ASSISTANT_INTENT_FIND_NEARBY_VENUE = 2;
  ASSISTANT_INTENT_COMPARE_PURCHASE_OPTIONS = 3;
  ASSISTANT_INTENT_EXPLAIN_PREFERENCE = 4;
  ASSISTANT_INTENT_EXPLAIN_RECOMMENDATION = 5;
  ASSISTANT_INTENT_PROFILE_STATUS = 6;
  ASSISTANT_INTENT_OUT_OF_SCOPE = 7;
  ASSISTANT_INTENT_INSUFFICIENT_DATA = 8;
}

enum AssistantCardType {
  ASSISTANT_CARD_TYPE_UNSPECIFIED = 0;
  ASSISTANT_CARD_TYPE_BEVERAGE = 1;
  ASSISTANT_CARD_TYPE_VENUE = 2;
  ASSISTANT_CARD_TYPE_PURCHASE_OPTION = 3;
  ASSISTANT_CARD_TYPE_COMPARISON = 4;
  ASSISTANT_CARD_TYPE_PROFILE_STATUS = 5;
}

enum ScreenContext {
  SCREEN_CONTEXT_UNSPECIFIED = 0;
  SCREEN_CONTEXT_HOME = 1;
  SCREEN_CONTEXT_BOARD = 2;
  SCREEN_CONTEXT_MAP = 3;
  SCREEN_CONTEXT_CHAT = 4;
}

message AskAssistantRequest {
  string conversation_id = 1;
  string message = 2;
  optional double lat = 3;
  optional double lng = 4;
  optional int32 radius_m = 5;
  optional int32 budget_hint_krw = 6;
  ScreenContext screen_context = 7;
}

message AskAssistantResponse {
  string conversation_id = 1;
  string message_id = 2;
  AssistantIntent intent = 3;
  string answer = 4;
  double confidence = 5;
  bool refused = 6;
  string refusal_reason = 7;
  repeated AssistantCard cards = 8;
  UsedSources used_sources = 9;
  repeated string missing_facts = 10;
  repeated string follow_up_questions = 11;
  google.protobuf.Timestamp created_at = 12;
}

message AssistantCard {
  AssistantCardType card_type = 1;
  string title = 2;
  string subtitle = 3;
  string display_reason = 4;
  double score = 5;
  optional int32 price_krw = 6;
  optional int32 distance_m = 7;
  optional int32 estimated_travel_time_sec = 8;
  string availability_status = 9;
  repeated string reason_codes = 10;
  string target_type = 11;
  string target_id = 12;
}

message UsedSources {
  string recommendation_request_id = 1;
  int64 profile_revision = 2;
  repeated string beverage_ids = 3;
  repeated string place_ids = 4;
  repeated string menu_item_ids = 5;
  repeated string inventory_item_ids = 6;
  repeated string price_offer_ids = 7;
  repeated string reason_codes = 8;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  string conversation_id = 1;
  repeated AssistantConversationMessage messages = 2;
}

message AssistantConversationMessage {
  string message_id = 1;
  string role = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
}

message RecordAssistantFeedbackRequest {
  string message_id = 1;
  string event_type = 2;
  string metadata_json = 3;
}

message RecordAssistantFeedbackResponse {
  bool recorded = 1;
}
