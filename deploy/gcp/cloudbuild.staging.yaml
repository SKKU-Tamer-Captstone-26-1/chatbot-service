# Cloud Build pipeline for GCP staging.
# Override every REPLACE_WITH_* substitution at submit time.

substitutions:
  _REGION: "asia-northeast3"
  _REPOSITORY: "REPLACE_WITH_ARTIFACT_REGISTRY_REPOSITORY"
  _SERVICE_NAME: "ai-chatbot-service-staging"
  _MIGRATION_JOB_NAME: "ai-chatbot-service-migrate-staging"
  _SERVICE_ACCOUNT: "REPLACE_WITH_CLOUD_RUN_SERVICE_ACCOUNT"
  _CLOUD_SQL_CONNECTION_NAME: "REPLACE_WITH_CLOUD_SQL_CONNECTION_NAME"
  _SERVERLESS_VPC_CONNECTOR: "REPLACE_WITH_SERVERLESS_VPC_CONNECTOR"
  _AUTH_SERVICE_URL: "REPLACE_WITH_AUTH_SERVICE_URL"
  _RECOMMENDATION_SERVICE_GRPC_ADDR: "REPLACE_WITH_RECOMMENDATION_GRPC_ADDR"
  _RECOMMENDATION_SERVICE_GRPC_TLS: "true"
  _RECOMMENDATION_SERVICE_SERVERLESS_AUTH_MODE: "google_id_token"
  _RECOMMENDATION_SERVICE_SERVERLESS_AUDIENCE: "REPLACE_WITH_RECOMMENDATION_CLOUD_RUN_AUDIENCE"
  _CHATBOT_LLM_ENDPOINT_URL: "REPLACE_WITH_OPENAI_COMPATIBLE_CHAT_COMPLETIONS_URL"
  _CHATBOT_LLM_MODEL: "Qwen/Qwen2.5-7B-Instruct"
  _CHATBOT_LLM_AUTH_MODE: "none"
  _CHATBOT_LLM_SERVERLESS_AUTH_MODE: "none"
  _CHATBOT_LLM_SERVERLESS_AUDIENCE: "REPLACE_WITH_LLM_CLOUD_RUN_AUDIENCE"
  _DB_DSN_SECRET_VERSION: "REPLACE_WITH_PINNED_SECRET_VERSION"
  _REDIS_URL_SECRET_VERSION: "REPLACE_WITH_PINNED_SECRET_VERSION"
  _HF_TOKEN_SECRET_VERSION: "REPLACE_WITH_PINNED_SECRET_VERSION"

steps:
  - id: "build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-chatbot-service:$BUILD_ID"
      - "."

  - id: "push-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-chatbot-service:$BUILD_ID"

  - id: "run-migrations"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - "gcloud"
      - "run"
      - "jobs"
      - "deploy"
      - "${_MIGRATION_JOB_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-chatbot-service:$BUILD_ID"
      - "--region=${_REGION}"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--set-secrets=CHATBOT_DB_DSN=chatbot-staging-db-dsn:${_DB_DSN_SECRET_VERSION}"
      - "--set-cloudsql-instances=${_CLOUD_SQL_CONNECTION_NAME}"
      - "--vpc-connector=${_SERVERLESS_VPC_CONNECTOR}"
      - "--vpc-egress=private-ranges-only"
      - "--command=chatbot-migrate"
      - "--execute-now"
      - "--wait"
      - "--quiet"

  - id: "deploy-service"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - "gcloud"
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-chatbot-service:$BUILD_ID"
      - "--region=${_REGION}"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--set-env-vars=CHATBOT_AUTH_MODE=validate_token,CHATBOT_AUTH_USER_ID_METADATA_KEY=x-user-id,CHATBOT_AUTH_AUTHORIZATION_METADATA_KEY=authorization,AUTH_SERVICE_URL=${_AUTH_SERVICE_URL},RECOMMENDATION_SERVICE_GRPC_ADDR=${_RECOMMENDATION_SERVICE_GRPC_ADDR},RECOMMENDATION_SERVICE_GRPC_TLS=${_RECOMMENDATION_SERVICE_GRPC_TLS},RECOMMENDATION_SERVICE_SERVERLESS_AUTH_MODE=${_RECOMMENDATION_SERVICE_SERVERLESS_AUTH_MODE},RECOMMENDATION_SERVICE_SERVERLESS_AUDIENCE=${_RECOMMENDATION_SERVICE_SERVERLESS_AUDIENCE},RECOMMENDATION_SERVICE_SERVERLESS_TOKEN_ENV=GOOGLE_ID_TOKEN,CHATBOT_LLM_PROVIDER=huggingface_tgi,CHATBOT_LLM_MODEL=${_CHATBOT_LLM_MODEL},CHATBOT_LLM_ENDPOINT_URL=${_CHATBOT_LLM_ENDPOINT_URL},CHATBOT_LLM_AUTH_MODE=${_CHATBOT_LLM_AUTH_MODE},CHATBOT_LLM_API_KEY_ENV=HF_TOKEN,CHATBOT_LLM_SERVERLESS_AUTH_MODE=${_CHATBOT_LLM_SERVERLESS_AUTH_MODE},CHATBOT_LLM_SERVERLESS_AUDIENCE=${_CHATBOT_LLM_SERVERLESS_AUDIENCE},CHATBOT_LLM_SERVERLESS_TOKEN_ENV=GOOGLE_ID_TOKEN,CHATBOT_LLM_TIMEOUT_MS=8000,CHATBOT_LLM_TEMPERATURE=0.2,CHATBOT_LLM_MAX_TOKENS=512,CHATBOT_DEFAULT_LANGUAGE=ko,CHATBOT_MAX_RETRIEVED_CANDIDATES=5,CHATBOT_MIN_CONFIDENCE=0.55,CHATBOT_REQUIRE_GROUNDED_FACTS=true,CHATBOT_CACHE_BACKEND=redis,CHATBOT_CACHE_PROFILE_STATUS_TTL_SEC=300,CHATBOT_CACHE_BEVERAGE_RECOMMENDATIONS_TTL_SEC=300,CHATBOT_CACHE_VENUE_RECOMMENDATIONS_TTL_SEC=120,CHATBOT_CACHE_PROMPT_CONTEXT_TTL_SEC=120,CHATBOT_CACHE_LOCATION_BUCKET_PRECISION=3,CHATBOT_STORE_CONVERSATIONS=true,CHATBOT_STORAGE_RETENTION_DAYS=365,CHATBOT_ASYNC_CONVERSATION_PERSISTENCE=true,CHATBOT_PERSISTENCE_QUEUE_MAX_SIZE=1000,CHATBOT_PERSISTENCE_RETRY_ATTEMPTS=3"
      - "--set-secrets=CHATBOT_DB_DSN=chatbot-staging-db-dsn:${_DB_DSN_SECRET_VERSION},CHATBOT_CACHE_REDIS_URL=chatbot-staging-redis-url:${_REDIS_URL_SECRET_VERSION},HF_TOKEN=chatbot-staging-hf-token:${_HF_TOKEN_SECRET_VERSION}"
      - "--set-cloudsql-instances=${_CLOUD_SQL_CONNECTION_NAME}"
      - "--vpc-connector=${_SERVERLESS_VPC_CONNECTOR}"
      - "--vpc-egress=private-ranges-only"
      - "--port=8080"
      - "--use-http2"
      - "--startup-probe=grpc.port=8080,grpc.service=ontheblock.chatbot.v1.ChatbotService,initialDelaySeconds=5,failureThreshold=6,timeoutSeconds=3,periodSeconds=10"
      - "--no-allow-unauthenticated"
      - "--quiet"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-chatbot-service:$BUILD_ID"
